<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CampusEats Menu Service</h1>
  <p class="sub">Live Menu Dashboard &mdash; Powered by GraphQL and MySQL</p>

  <div id="list" class="dish-grid">Loading menu items&hellip;</div>

  <form id="addDishForm">
    <h3>Add New Dish</h3>
    <div class="form-group">
      <input id="dishName" type="text" placeholder="Dish Name (e.g., Paneer Roll)" required>
    </div>
    <div class="form-group">
      <input id="dishPrice" type="number" step="0.5" placeholder="Price (INR)" required>
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input id="dishAvailable" type="checkbox" checked> In Stock / Available
      </label>
    </div>
    <button type="submit">Add Dish</button>
  </form>

  <script>
    const API = 'http://localhost:4000/';

    async function gql(query, variables) {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });
      const json = await res.json();
      return json.data;
    }

    // 1. READ: Fetch all dishes
    async function loadDishes() {
      const data = await gql(`{ dishes { id name price available } }`);
      const listEl = document.getElementById('list');

      if (!data || !data.dishes.length) {
        listEl.innerHTML = '<p>No menu items available.</p>';
        return;
      }

      listEl.innerHTML = data.dishes.map(d => `
        <div class="dish-card">
          <h2>${d.name}</h2>
          <div class="price">₹${Number(d.price).toFixed(2)}</div>
          <span class="badge ${d.available ? 'in-stock' : 'out-stock'}">
            ${d.available ? 'Available' : 'Out of Stock'}
          </span>
        </div>
      `).join('');
    }

    // 2. WRITE: Mutation to add a dish
    document.getElementById('addDishForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('dishName').value;
      const price = parseFloat(document.getElementById('dishPrice').value);
      const available = document.getElementById('dishAvailable').checked;

      const mutation = `
        mutation AddNewDish($input: AddDishInput!) {
          addDish(input: $input) {
            id
            name
            price
            available
          }
        }
      `;

      await gql(mutation, { input: { name, price, available } });
      e.target.reset();
      document.getElementById('dishAvailable').checked = true;
      loadDishes();
    });

    loadDishes();
  </script>
</body>
</html>
